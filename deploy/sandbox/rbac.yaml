apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haro-sandbox-manager
  namespace: haro-sandboxes
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete", "get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haro-sandbox-manager
  namespace: haro-sandboxes
subjects:
  - kind: ServiceAccount
    name: haro-bot
    namespace: haro-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haro-sandbox-manager
