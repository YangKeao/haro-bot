apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haro-sandbox-runtime
  namespace: haro-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haro-sandbox
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: haro-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: haro-bot
      ports:
        - protocol: TCP
          port: 8888
  # Sandboxes deliberately have unrestricted egress. Apply cluster-wide policy
  # separately if a deployment needs allowlisted destinations.
  egress:
    - {}
