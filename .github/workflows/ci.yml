name: Go CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./...

  integration-e2e:
    name: Integration and E2E
    runs-on: ubuntu-latest
    needs: [unit, frontend]
    timeout-minutes: 90
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install TiUP
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          echo "${HOME}/.tiup/bin" >> "${GITHUB_PATH}"

      - name: Start TiDB playground
        shell: bash
        run: |
          set -euo pipefail
          nohup "${HOME}/.tiup/bin/tiup" playground v8.5.5 \
            --db 1 \
            --pd 1 \
            --kv 1 \
            --tiproxy 1 \
            --without-monitor \
            --tag gha-ci > "${RUNNER_TEMP}/tiup-playground.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/tiup-playground.pid"

      - name: Validate integration secrets
        shell: bash
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          missing=0
          for key in LLM_BASE_URL LLM_MODEL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required secret: ${key}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Wait for TiDB readiness
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..1200}; do
            if grep -q "TiDB Playground Cluster is started" "${RUNNER_TEMP}/tiup-playground.log"; then
              if (echo > /dev/tcp/127.0.0.1/4000) >/dev/null 2>&1; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "::error::TiDB playground did not become fully ready"
          tail -n 200 "${RUNNER_TEMP}/tiup-playground.log" || true
          exit 1

      - name: Generate integration config
        shell: bash
        run: |
          set -euo pipefail
          {
            printf "[db]\n"
            printf "tidb_dsn = \"root:@tcp(127.0.0.1:4000)/haro_bot?parseTime=true\"\n\n"
          } > "${RUNNER_TEMP}/integration.toml"
          echo "HARO_CONFIG_PATH=${RUNNER_TEMP}/integration.toml" >> "${GITHUB_ENV}"

      - name: Run integration and e2e tests
        env:
          TIDB_DSN: root:@tcp(127.0.0.1:4000)/haro_bot?parseTime=true
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: go test -tags=integration ./internal/... -count=1

      - name: Stop TiDB playground
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${RUNNER_TEMP}/tiup-playground.pid" ]; then
            pid="$(cat "${RUNNER_TEMP}/tiup-playground.pid" || true)"
            if [ -n "${pid}" ]; then
              kill -INT "${pid}" >/dev/null 2>&1 || true
            fi
          fi
          sleep 3
