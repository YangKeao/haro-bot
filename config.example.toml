[server]
addr = ":8080"

[web]
access_token = "replace-with-a-long-random-token"
cookie_secure = false
assets_dir = "./web/dist"
# Public origin used for MCP OAuth callbacks (required only for OAuth MCP servers).
public_url = "http://localhost:8080"

[web.object_storage]
endpoint = "127.0.0.1:9000"
region = "us-east-1"
bucket = "haro-bot"
access_key = "minioadmin"
secret_key = "minioadmin"
use_ssl = false
force_path_style = true

[db]
tidb_dsn = "root:@tcp(127.0.0.1:4000)/haro_bot?parseTime=true"

[telegram]
token = ""

[skills]
dir = "./skills"
repo_allowlist = []
sync_interval = "10m"

[tool]
max_turns = 1024

# Kubernetes Agent Sandbox v0.5.3 must be installed in the target cluster.
# Set HARO_SANDBOX_SECRET_KEY to a random, base64-encoded 32-byte key.
[sandbox]
enabled = false
namespace = "haro-sandboxes"
runtime_class = "gvisor"
storage_class = ""
default_image = "ghcr.io/yangkeao/haro-bot-sandbox:latest"
helper_image = "ghcr.io/yangkeao/haro-bot-sandbox:latest"
runtime_port = 8888
# Maximum duration of one empty write_stdin poll. Commands themselves have no lifetime limit.
background_terminal_max_timeout_ms = 300000
default_cpu_limit_millis = 2000
default_memory_limit_mib = 4096
default_ephemeral_storage_mib = 4096
default_workspace_storage_mib = 10240
max_cpu_limit_millis = 8000
max_memory_limit_mib = 16384
max_ephemeral_storage_mib = 32768
max_workspace_storage_mib = 102400
max_running = 10

[log]
level = "info"
development = false
encoding = "json"
llm_http_debug = false
