[server]
addr = ":8080"

[web]
access_token = "replace-with-a-long-random-token"
cookie_secure = false
assets_dir = "./web/dist"

[web.object_storage]
endpoint = "127.0.0.1:9000"
region = "us-east-1"
bucket = "haro-bot"
access_key = "minioadmin"
secret_key = "minioadmin"
use_ssl = false
force_path_style = true

[db]
tidb_dsn = "root:@tcp(127.0.0.1:4000)/haro_bot?parseTime=true"

[telegram]
token = ""

[skills]
dir = "./skills"
repo_allowlist = []
sync_interval = "10m"

[brave]
search_api_key = ""

[fs]
allowed_roots = ["./workspace"]

[tool]
max_turns = 1024

[log]
level = "info"
development = false
encoding = "json"
llm_http_debug = false
